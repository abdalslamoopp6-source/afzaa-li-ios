name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install --save @capacitor/core @capacitor/cli @capacitor/ios

      - name: Prepare web files
        run: |
          mkdir -p www
          cp abdalslam.index.html www/index.html

      - name: Create Capacitor Config & Add iOS
        run: |
          echo '{
            "appId": "com.afzaalili.client",
            "appName": "AfzaaLi",
            "webDir": "www"
          }' > capacitor.config.json
          npx cap add ios
          # ضبط الحد الأدنى للإصدار ليدعم أيفون 12 وما فوق (iOS 14.0)
          sed -i '' "s/platform :ios, .*/platform :ios, '14.0'/" ios/App/Podfile
          npx cap sync ios

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: afzaa-li-ios-project
          path: ios
