name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install --save @capacitor/core @capacitor/cli @capacitor/ios

      - name: Prepare web files
        run: |
          mkdir -p www
          cp abdalslam.index.html www/index.html

      - name: Create Capacitor Config & Add iOS
        run: |
          echo '{
            "appId": "com.afzaalili.client",
            "appName": "AfzaaLi",
            "webDir": "www"
          }' > capacitor.config.json
          npx cap add ios
          
          # كتابة ملف Podfile جديد ومخصص يدعم أيفون 12 وما فوق (iOS 14.0) مباشرة
          echo "require_relative '../../node_modules/@capacitor/ios/scripts/pods'

          platform :ios, '14.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          target 'App' do
            capacitor_pods
          end" > ios/App/Podfile

          npx cap sync ios

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: afzaa-li-ios-project
          path: ios
